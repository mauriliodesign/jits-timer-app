<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <title>Jiu-jitsu Timer</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: Inter, sans-serif;
        background-color: #121214;
        color: white;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
      }
      .loading {
        font-size: 2rem;
        margin-bottom: 1rem;
      }
      .status {
        font-size: 1rem;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <div class="loading">🥋 Jiu-jitsu Timer</div>
    <div class="status">Carregando...</div>
    <script>
      // Load the React app immediately
      console.log('Jiu-jitsu Timer loading...');
      
      // Load CSS first
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = '/assets/index-cpruR9Ei.css';
      link.onload = () => console.log('CSS loaded successfully');
      link.onerror = () => console.error('Failed to load CSS');
      document.head.appendChild(link);
      
      // Load JavaScript immediately
      const script = document.createElement('script');
      script.type = 'module';
      script.src = '/assets/index-DcwqpY0L.js';
      script.onload = () => console.log('JavaScript loaded successfully');
      script.onerror = () => console.error('Failed to load JavaScript');
      document.head.appendChild(script);
      
      // Check if React app loads after 5 seconds
      setTimeout(() => {
        if (document.querySelector('#root').children.length === 0) {
          console.log('React app not loaded, showing fallback');
          document.querySelector('.status').textContent = 'Erro ao carregar aplicação. Recarregue a página.';
        } else {
          console.log('React app loaded successfully');
        }
      }, 5000);
    </script>
  </body>
</html>
