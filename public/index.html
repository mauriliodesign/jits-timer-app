<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <title>Jiu-jitsu Timer</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: Inter, sans-serif;
        background-color: #121214;
        color: white;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
      }
      .loading {
        font-size: 2rem;
        margin-bottom: 1rem;
      }
      .status {
        font-size: 1rem;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="loading">🥋 Jiu-jitsu Timer</div>
      <div class="status">Carregando...</div>
    </div>
    <script>
      // Set Firebase environment variables
      window.VITE_FIREBASE_API_KEY = 'AIzaSyCD2L9pWh9Ww97wqf6wROX5eJfz6PvGAc0';
      window.VITE_FIREBASE_PROJECT_ID = 'jits-timer';
      window.VITE_FIREBASE_APP_ID = '1:743576123702:web:f62c5e99355cd592d09b97';
      window.VITE_FIREBASE_MESSAGING_SENDER_ID = '743576123702';
      window.VITE_FIREBASE_MEASUREMENT_ID = 'G-7D5J1EMLJ3';
      
      // Also set as process.env for compatibility
      window.process = window.process || {};
      window.process.env = window.process.env || {};
      window.process.env.VITE_FIREBASE_API_KEY = window.VITE_FIREBASE_API_KEY;
      window.process.env.VITE_FIREBASE_PROJECT_ID = window.VITE_FIREBASE_PROJECT_ID;
      window.process.env.VITE_FIREBASE_APP_ID = window.VITE_FIREBASE_APP_ID;
      window.process.env.VITE_FIREBASE_MESSAGING_SENDER_ID = window.VITE_FIREBASE_MESSAGING_SENDER_ID;
      window.process.env.VITE_FIREBASE_MEASUREMENT_ID = window.VITE_FIREBASE_MEASUREMENT_ID;
      
      // Load the React app immediately
      console.log('Jiu-jitsu Timer loading...');
      console.log('Firebase config set:', window.VITE_FIREBASE_API_KEY ? 'OK' : 'MISSING');
      
      // Load CSS first
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = '/assets/index-C5AVgwh2.css';
      link.onload = () => console.log('CSS loaded successfully');
      link.onerror = () => console.error('Failed to load CSS');
      document.head.appendChild(link);
      
      // Load JavaScript after a small delay to ensure Firebase config is available
      setTimeout(() => {
        const script = document.createElement('script');
        script.type = 'module';
        script.src = '/assets/index-DRcd8AyZ.js';
        script.onload = () => console.log('JavaScript loaded successfully');
        script.onerror = () => console.error('Failed to load JavaScript');
        document.head.appendChild(script);
      }, 100);
      
      // Check if React app loads after 5 seconds
      setTimeout(() => {
        const root = document.querySelector('#root');
        if (root && root.children.length === 0) {
          console.log('React app not loaded, showing fallback');
          document.querySelector('.status').textContent = 'Erro ao carregar aplicação. Recarregue a página.';
        } else {
          console.log('React app loaded successfully');
        }
      }, 5000);
    </script>
  </body>
</html>
