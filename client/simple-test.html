<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Timer Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #121214;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: #17171a;
            padding: 2rem;
            border-radius: 1rem;
            border: 1px solid #252529;
        }
        .timer {
            font-size: 4rem;
            font-weight: bold;
            font-family: monospace;
            margin: 1rem 0;
        }
        .status {
            font-size: 1.5rem;
            margin: 1rem 0;
            color: #59FF3A;
        }
        .rounds {
            font-size: 1.2rem;
            margin: 1rem 0;
            color: #5a5a60;
        }
        .buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin: 2rem 0;
        }
        button {
            padding: 1rem 2rem;
            font-size: 1.2rem;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            background: #59FF3A;
            color: #121214;
            font-weight: bold;
        }
        button:hover {
            background: #4ade80;
        }
        button:disabled {
            background: #6b7280;
            cursor: not-allowed;
        }
        .config {
            margin: 2rem 0;
            padding: 1rem;
            background: #1e1e21;
            border-radius: 0.5rem;
        }
        .config input {
            padding: 0.5rem;
            margin: 0.5rem;
            border: 1px solid #252529;
            border-radius: 0.25rem;
            background: #17171a;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Simple Timer Test</h1>
        
        <div class="timer" id="timer">00:00</div>
        <div class="status" id="status">Ready</div>
        <div class="rounds" id="rounds">Round 0 of 0</div>
        
        <div class="buttons">
            <button id="startBtn" onclick="startTimer()">Start</button>
            <button id="pauseBtn" onclick="pauseTimer()" disabled>Pause</button>
            <button id="resetBtn" onclick="resetTimer()">Reset</button>
        </div>
        
        <div class="config">
            <h3>Configuration</h3>
            <input type="number" id="rounds" placeholder="Rounds" value="5" min="1" max="50">
            <input type="number" id="fightTime" placeholder="Fight Time (seconds)" value="300" min="30" max="3600">
            <input type="number" id="restTime" placeholder="Rest Time (seconds)" value="60" min="5" max="600">
            <button onclick="updateConfig()">Update Config</button>
        </div>
    </div>

    <script>
        let ws = null;
        let timerState = {
            currentTime: 0,
            currentRound: 1,
            totalRounds: 5,
            isRunning: false,
            isResting: false,
            isFinished: false
        };

        function connectWebSocket() {
            ws = new WebSocket(`ws://${window.location.hostname}:3000`);
            
            ws.onopen = () => {
                console.log('Connected to server');
            };
            
            ws.onmessage = (event) => {
                const message = JSON.parse(event.data);
                if (message.type === 'timer_update') {
                    updateDisplay(message.data);
                }
            };
            
            ws.onclose = () => {
                console.log('Disconnected from server');
                setTimeout(connectWebSocket, 1000);
            };
        }

        function updateDisplay(state) {
            timerState = state;
            
            // Update timer display
            const minutes = Math.floor(state.currentTime / 60);
            const seconds = state.currentTime % 60;
            document.getElementById('timer').textContent = 
                `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            
            // Update status
            let status = 'Ready';
            if (state.isFinished) {
                status = 'Finished';
            } else if (state.isRunning) {
                status = state.isResting ? 'Rest' : 'Fight';
            }
            document.getElementById('status').textContent = status;
            
            // Update rounds
            document.getElementById('rounds').textContent = 
                `Round ${state.currentRound} of ${state.totalRounds}`;
            
            // Update buttons
            document.getElementById('startBtn').disabled = state.isRunning;
            document.getElementById('pauseBtn').disabled = !state.isRunning;
        }

        async function startTimer() {
            try {
                const response = await fetch('/api/timer/control', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'start' })
                });
                const state = await response.json();
                updateDisplay(state);
            } catch (error) {
                console.error('Error starting timer:', error);
            }
        }

        async function pauseTimer() {
            try {
                const response = await fetch('/api/timer/control', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'pause' })
                });
                const state = await response.json();
                updateDisplay(state);
            } catch (error) {
                console.error('Error pausing timer:', error);
            }
        }

        async function resetTimer() {
            try {
                const response = await fetch('/api/timer/control', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'reset' })
                });
                const state = await response.json();
                updateDisplay(state);
            } catch (error) {
                console.error('Error resetting timer:', error);
            }
        }

        async function updateConfig() {
            try {
                const rounds = parseInt(document.getElementById('rounds').value);
                const fightTime = parseInt(document.getElementById('fightTime').value);
                const restTime = parseInt(document.getElementById('restTime').value);
                
                const response = await fetch('/api/timer/config', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ rounds, fightTime, restTime })
                });
                const state = await response.json();
                updateDisplay(state);
            } catch (error) {
                console.error('Error updating config:', error);
            }
        }

        // Connect on page load
        connectWebSocket();
        
        // Load initial state
        fetch('/api/timer/current')
            .then(response => response.json())
            .then(state => updateDisplay(state))
            .catch(error => console.error('Error loading initial state:', error));
    </script>
</body>
</html>
